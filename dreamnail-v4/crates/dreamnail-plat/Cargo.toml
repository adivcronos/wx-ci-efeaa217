[package]
name = "dreamnail-plat"
version.workspace = true
edition.workspace = true

# The real-world adapters for the core's ports. Phase A ships compiling STUBS
# (every method returns EngineError::Unsupported) so the structure is in place
# and the workspace builds; the real per-OS implementations land as their own
# tasks (russh tunnel, spawn Xray, Windows registry / macOS networksetup / Linux
# gsettings+kwriteconfig proxy, reqwest route check).
[dependencies]
# Decompress the bundled ad/tracker domain list (assets/ads.txt.gz). Already in
# the tree (via tun2proxy deps), so no new download.
flate2 = "1.1"
aes-gcm = "0.10"
dreamnail-core = { path = "../dreamnail-core" }
pbkdf2 = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "socks", "rustls-tls"] }
russh = "0.63.2"
# TLS wrapper for the port-443 "backup door" (SSH inside TLS, ALPN "dn1").
# Already in the tree via reqwest's rustls, so no new download.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# WebSocket framing for the "looks like a website" backup door (Via::Ws). We
# drive TLS ourselves (tokio-rustls above) and only use tungstenite for the HTTP
# upgrade + frame codec over the already-connected stream, so no tls features.
tokio-tungstenite = { version = "0.24.0", default-features = false, features = ["handshake"] }
# Stream/Sink traits for the WebSocket byte-stream adapter (already in the tree).
futures-util = { version = "0.3", default-features = false }
serde_json = "1.0.151"
sha2 = "0.10"
# Ed25519 verification of the operator's signed remote-control directives and OTA
# manifest. Already in the tree (rustls pulls ring), so no new download.
ring = "0.17"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
uuid = { version = "1.26.0", features = ["v5"] }

[target."cfg(windows)".dependencies]
# Win32_UI_Shell = IsUserAnAdmin() for the TUN elevation gate (fail fast when the
# Windows process isn't elevated, mirroring the unix euid==0 check).
# Win32_NetworkManagement_* + Win32_Networking_WinSock = GetAdaptersAddresses /
# GetBestInterface for the foreign-VPN detector (conflict.rs) — native API calls,
# so no PowerShell/process spawning that behavioural antivirus might score.
windows-sys = { version = "0.61.2", features = [
    "Win32_Networking_WinInet",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

# geteuid() for the TUN privilege pre-check (fail fast when unprivileged instead
# of spawning tun2proxy and blocking the engine thread). Already in the tree via
# tun2proxy/tproxy-config, so this adds no new download.
[target."cfg(unix)".dependencies]
libc = "0.2"

# TUN transparent-routing mode (the `TunProxy` adapter). Only the three desktop
# OSes we ship — tun2proxy pulls in wintun on Windows / utun on macOS. `SystemProxy`
# stays the default; TUN is opt-in (DREAMNAIL_TUN=1 in the CLI for now).
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tun2proxy = "0.8"
tproxy-config = { version = "7.0.7", default-features = false }
